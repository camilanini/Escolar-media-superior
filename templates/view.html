{% extends "base.html" %}

{% block contenido %}
<div class="contenido-principal">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>{{ item.titulo }}</h2>
        <div>
            <a href="{{ url_for('editar_anuncio', id=item._id) }}" class="btn btn-warning btn-sm">
                <i class="fas fa-edit"></i> Editar
            </a>
            <form action="{{ url_for('eliminar_anuncio', id=item._id) }}" method="POST" class="d-inline">
                <button type="submit" class="btn btn-danger btn-sm" 
                        onclick="return confirm('¿Estás seguro de que quieres eliminar este anuncio?')">
                    <i class="fas fa-trash"></i> Eliminar
                </button>
            </form>
        </div>
    </div>

    <div class="mb-4">
        <p class="text-muted">
            <strong>Autor:</strong> {{ item.autor }} | 
            <strong>Fecha:</strong> 
            {% if item.fecha %}
                {{ item.fecha.strftime('%d/%m/%Y %H:%M') }}
            {% else %}
                Fecha no disponible
            {% endif %}
        </p>
    </div>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Contenido</h5>
            <p class="card-text">{{ item.contenido }}</p>
        </div>
    </div>

    <div class="mt-3">
        <a href="{{ url_for('anuncios') }}" class="btn btn-primary">
            <i class="fas fa-arrow-left"></i> Volver a Anuncios
        </a>
    </div>
</div>
{% endblock %}
