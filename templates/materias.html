<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1><i class="fas fa-book me-2"></i>Mis Materias</h1>
        
        <!-- Card de Materia Ejemplo -->
        <div class="card mt-3">
            <div class="card-body">
                <h5 class="card-title">Matemáticas</h5>
                <p class="card-text">Profesor: Juan Pérez</p>
                <button class="btn btn-primary" onclick="verCalificaciones('Matemáticas')">
                    <i class="fas fa-chart-line me-1"></i> Ver Calificaciones
                </button>
                <button class="btn btn-success" onclick="verTareas('Matemáticas')">
                    <i class="fas fa-tasks me-1"></i> Ver Tareas
                </button>
            </div>
        </div>

        <!-- Más materias... -->
    </div>

    <!-- Modal para mostrar contenido -->
    <div class="modal fade" id="modalMaterial" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalMaterialTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalMaterialBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Función para ver calificaciones
        function verCalificaciones(materia) {
            let modalTitle = document.getElementById('modalMaterialTitle');
            let modalBody = document.getElementById('modalMaterialBody');

            modalTitle.innerHTML = `<i class="fas fa-chart-line me-2"></i> Calificaciones - ${materia}`;

            
            modalBody.innerHTML = `
                <div class="text-center py-4">
                    <i class="fas fa-chart-bar fa-3x text-primary mb-3"></i>
                    <h5>Calificaciones de ${materia}</h5>
                    <p class="text-muted">Esta funcionalidad estará disponible pronto.</p>
                </div>
                <div class="mt-4">
                    <div class="progress mb-3" style="height: 20px;">
                        <div class="progress-bar bg-success" style="width: 85%">Parcial 1: 8.5</div>
                    </div>
                    <div class="progress mb-3" style="height: 20px;">
                        <div class="progress-bar bg-info" style="width: 90%">Parcial 2: 9.0</div>
                    </div>
                    <div class="progress mb-3" style="height: 20px;">
                        <div class="progress-bar bg-warning" style="width: 88%">Parcial 3: 8.8</div>
                    </div>
                </div>
            `;
            
            let modal = new bootstrap.Modal(document.getElementById('modalMaterial'));
            modal.show();
        }

        // Función para ver tareas
        function verTareas(materia) {
            let modalTitle = document.getElementById('modalMaterialTitle');
            let modalBody = document.getElementById('modalMaterialBody');

            modalTitle.innerHTML = `<i class="fas fa-tasks me-2"></i> Tareas - ${materia}`;
            modalBody.innerHTML = `
                <div class="text-center py-4">
                    <i class="fas fa-clipboard-list fa-3x text-success mb-3"></i>
                    <h5>Tareas de ${materia}</h5>
                    <p class="text-muted">Esta funcionalidad estará disponible pronto.</p>
                </div>
            `;
            
            let modal = new bootstrap.Modal(document.getElementById('modalMaterial'));
            modal.show();
        }
    </script>
</body>
</html>
