{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="fas fa-calendar me-2"></i>Agenda Escolar</h4>
                <div>
                    <span class="badge bg-primary me-2" id="mesActual"></span>
                    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#nuevoEventoModal">
                        <i class="fas fa-plus me-1"></i>Nuevo Evento
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="row">
                    <!-- Calendario Interactivo -->
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <!-- Navegación del Calendario -->
                                <div class="calendar-navigation d-flex justify-content-between align-items-center mb-3">
                                    <button class="btn btn-outline-primary btn-sm" id="prevMonth">
                                        <i class="fas fa-chevron-left"></i>
                                    </button>
                                    <h5 class="mb-0" id="calendarTitle">Calendario</h5>
                                    <button class="btn btn-outline-primary btn-sm" id="nextMonth">
                                        <i class="fas fa-chevron-right"></i>
                                    </button>
                                </div>
                                
                                <div id="calendar-mini" class="text-center">
                                    <div class="calendar-grid" id="calendarGrid">
                                        <!-- Los días se generarán dinámicamente con JavaScript -->
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Formulario rápido para nuevo evento -->
                        <div class="card mt-3">
                            <div class="card-body">
                                <h6><i class="fas fa-plus-circle me-2"></i>Agregar Evento Rápido</h6>
                                <form id="formEventoRapido">
                                    <div class="mb-2">
                                        <label class="form-label">Fecha *</label>
                                        <input type="date" class="form-control" id="fechaRapida" required
                                               min="2025-10-01" max="2026-01-31">
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label">Hora</label>
                                        <input type="time" class="form-control" id="horaRapida">
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label">Descripción *</label>
                                        <input type="text" class="form-control" id="descripcionRapida" 
                                               placeholder="¿Qué es el evento?" required>
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label">Tipo</label>
                                        <select class="form-select" id="tipoRapido">
                                            <option value="clase">Clase</option>
                                            <option value="examen">Examen</option>
                                            <option value="tarea">Tarea</option>
                                            <option value="tutoria">Tutoría</option>
                                            <option value="personal" selected>Personal</option>
                                            <option value="proyecto">Proyecto</option>
                                            <option value="reunion">Reunión</option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-sm w-100">
                                        <i class="fas fa-plus me-1"></i>Agregar Evento
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Eventos del Día Seleccionado -->
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0" id="tituloEventosDia">
                                    <i class="fas fa-calendar-day me-2"></i>Eventos para Hoy
                                </h5>
                            </div>
                            <div class="card-body">
                                <div id="eventosContainer" class="eventos-container">
                                    <!-- Los eventos se cargarán dinámicamente -->
                                    <div class="text-center text-muted py-5">
                                        <i class="fas fa-calendar-check fa-3x mb-3"></i>
                                        <p>Selecciona un día para ver los eventos</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Próximos Eventos -->
                        <div class="card mt-4">
                            <div class="card-header">
                                <h5 class="mb-0"><i class="fas fa-calendar-alt me-2"></i>Próximos Eventos</h5>
                            </div>
                            <div class="card-body">
                                <div class="list-group" id="proximosEventos">
                                    <!-- Los próximos eventos se cargarán dinámicamente -->
                                    <div class="text-center text-muted py-3">
                                        <i class="fas fa-calendar-plus fa-lg mb-2"></i>
                                        <p>No hay próximos eventos</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal para Nuevo Evento -->
<div class="modal fade" id="nuevoEventoModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-calendar-plus me-2"></i>Nuevo Evento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formNuevoEvento">
                    <div class="mb-3">
                        <label class="form-label">Título del Evento *</label>
                        <input type="text" class="form-control" id="tituloEvento" required 
                               placeholder="Ej: Examen de Matemáticas">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha *</label>
                            <input type="date" class="form-control" id="fechaEvento" required
                                   min="2025-10-01" max="2026-01-31">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Hora</label>
                            <input type="time" class="form-control" id="horaEvento">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control" id="descripcionEvento" rows="3" 
                                  placeholder="Descripción detallada del evento..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo de Evento</label>
                        <select class="form-select" id="tipoEvento">
                            <option value="clase">📚 Clase</option>
                            <option value="examen">📝 Examen</option>
                            <option value="tarea">📋 Tarea</option>
                            <option value="tutoria">👨‍🏫 Tutoría</option>
                            <option value="proyecto">💼 Proyecto</option>
                            <option value="reunion">👥 Reunión</option>
                            <option value="personal">👤 Personal</option>
                            <option value="deporte">⚽ Deporte</option>
                            <option value="cultural">🎭 Cultural</option>
                            <option value="otro">❓ Otro</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Prioridad</label>
                        <select class="form-select" id="prioridadEvento">
                            <option value="baja">🟢 Baja</option>
                            <option value="media" selected>🟡 Media</option>
                            <option value="alta">🔴 Alta</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="guardarEventoBtn">
                    <i class="fas fa-save me-1"></i>Guardar Evento
                </button>
            </div>
        </div>
    </div>
</div>

<script>
let eventos = JSON.parse(localStorage.getItem('eventosAgenda')) || [];
let mesActual = new Date().getMonth() + 1; // Mes actual (1-12)
let añoActual = new Date().getFullYear(); // Año actual
let diaSeleccionado = new Date().getDate(); // Día actual
let mesSeleccionado = mesActual;
let añoSeleccionado = añoActual;

const meses = [
    'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
    'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
];

const diasSemana = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

const iconosEvento = {
    'clase': 'fas fa-chalkboard-teacher',
    'examen': 'fas fa-file-alt',
    'tarea': 'fas fa-tasks',
    'tutoria': 'fas fa-chalkboard-teacher',
    'proyecto': 'fas fa-project-diagram',
    'reunion': 'fas fa-users',
    'personal': 'fas fa-user',
    'deporte': 'fas fa-futbol',
    'cultural': 'fas fa-music',
    'otro': 'fas fa-calendar'
};

const coloresEvento = {
    'clase': 'primary',
    'examen': 'danger',
    'tarea': 'warning',
    'tutoria': 'info',
    'proyecto': 'success',
    'reunion': 'secondary',
    'personal': 'dark',
    'deporte': 'success',
    'cultural': 'purple',
    'otro': 'secondary'
};

document.addEventListener('DOMContentLoaded', function() {
    inicializarAgenda();
    configurarEventListeners();
    cargarEventosIniciales();
});

function inicializarAgenda() {
    const hoy = new Date();
    const fechaMin = new Date(2025, 9, 1);  // Octubre 1, 2025 (mes 9 = octubre)
    const fechaMax = new Date(2026, 0, 31); // Enero 31, 2026 (mes 0 = enero)
    
    // Ajustar si estamos fuera del rango permitido
    if (hoy < fechaMin) {
        mesActual = 10;  // Octubre
        añoActual = 2025;
        diaSeleccionado = 1;
    } else if (hoy > fechaMax) {
        mesActual = 1;   // Enero
        añoActual = 2026;
        diaSeleccionado = 31;
    } else {
        mesActual = hoy.getMonth() + 1;
        añoActual = hoy.getFullYear();
        diaSeleccionado = hoy.getDate();
    }
    
    mesSeleccionado = mesActual;
    añoSeleccionado = añoActual;
    
    // Configurar límites de fecha en inputs
    document.getElementById('fechaRapida').min = '2025-10-01';
    document.getElementById('fechaRapida').max = '2026-01-31';
    document.getElementById('fechaEvento').min = '2025-10-01';
    document.getElementById('fechaEvento').max = '2026-01-31';
    
    const hoyStr = new Date().toISOString().split('T')[0];
    document.getElementById('fechaRapida').value = hoyStr;
    document.getElementById('fechaEvento').value = hoyStr;
    
    generarCalendario(mesActual, añoActual);
    mostrarEventosDelDia(diaSeleccionado, mesActual, añoActual);
    actualizarProximosEventos();
}

function configurarEventListeners() {
    document.getElementById('prevMonth').addEventListener('click', function() {
        cambiarMes(-1);
    });
    
    document.getElementById('nextMonth').addEventListener('click', function() {
        cambiarMes(1);
    });
    
    document.getElementById('guardarEventoBtn').addEventListener('click', guardarEvento);
    
    document.getElementById('formEventoRapido').addEventListener('submit', function(e) {
        e.preventDefault();
        agregarEventoRapido();
    });
    
    document.getElementById('nuevoEventoModal').addEventListener('hidden.bs.modal', function() {
        document.getElementById('formNuevoEvento').reset();
        const hoyStr = new Date().toISOString().split('T')[0];
        document.getElementById('fechaEvento').value = hoyStr;
    });
}

function cargarEventosIniciales() {
    if (eventos.length === 0) {
        eventos = [
            {
                id: '1',
                titulo: 'Inicio de Semestre',
                fecha: '2025-10-06',
                hora: '08:00',
                descripcion: 'Inicio del semestre Oct 2025 - Ene 2026',
                tipo: 'clase',
                prioridad: 'alta'
            },
            {
                id: '2',
                titulo: 'Examen Parcial Matemáticas',
                fecha: '2025-11-15',
                hora: '10:00',
                descripcion: 'Examen parcial unidad 1-3',
                tipo: 'examen',
                prioridad: 'alta'
            },
            {
                id: '3',
                titulo: 'Entrega Proyecto Programación',
                fecha: '2025-12-10',
                hora: '23:59',
                descripcion: 'Entrega del proyecto final',
                tipo: 'proyecto',
                prioridad: 'alta'
            },
            {
                id: '4',
                titulo: 'Tutoría Grupal',
                fecha: '2025-10-20',
                hora: '14:00',
                descripcion: 'Revisión de avances',
                tipo: 'tutoria',
                prioridad: 'media'
            },
            {
                id: '5',
                titulo: 'Vacaciones de Diciembre',
                fecha: '2025-12-22',
                hora: '00:00',
                descripcion: 'Inicio de vacaciones',
                tipo: 'personal',
                prioridad: 'baja'
            },
            {
                id: '6',
                titulo: 'Fin de Semestre',
                fecha: '2026-01-30',
                hora: '18:00',
                descripcion: 'Final del semestre',
                tipo: 'clase',
                prioridad: 'alta'
            }
        ];
        localStorage.setItem('eventosAgenda', JSON.stringify(eventos));
    }
}

function generarCalendario(mes, año) {
    const calendarGrid = document.getElementById('calendarGrid');
    const mesActualElement = document.getElementById('mesActual');
    const calendarTitle = document.getElementById('calendarTitle');
    
    const nombreMes = meses[mes - 1];
    mesActualElement.textContent = `${nombreMes} ${año}`;
    calendarTitle.textContent = `${nombreMes} ${año}`;
    
    // Calcular límites para botones de navegación
    const fechaActual = new Date(año, mes - 1, 1);
    const fechaMin = new Date(2025, 9, 1);   // Oct 1, 2025
    const fechaMax = new Date(2026, 0, 31);  // Jan 31, 2026
    
    // Deshabilitar botones si estamos en los límites
    document.getElementById('prevMonth').disabled = fechaActual <= fechaMin;
    document.getElementById('nextMonth').disabled = fechaActual >= new Date(2026, 0, 1);
    
    calendarGrid.innerHTML = '';
    
    // Encabezados de días de la semana
    diasSemana.forEach(dia => {
        const diaHeader = document.createElement('div');
        diaHeader.className = 'calendar-header';
        diaHeader.textContent = dia;
        calendarGrid.appendChild(diaHeader);
    });
    
    // Día de la semana del primer día del mes (0 = Domingo)
    const primerDiaSemana = new Date(año, mes - 1, 1).getDay();
    
    // Obtener días en el mes
    const ultimoDiaMes = new Date(año, mes, 0);
    const diasEnMes = ultimoDiaMes.getDate();
    
    const hoy = new Date();
    
    // Días vacíos antes del primer día del mes
    for (let i = 0; i < primerDiaSemana; i++) {
        const emptyDay = document.createElement('div');
        emptyDay.className = 'calendar-day empty';
        calendarGrid.appendChild(emptyDay);
    }
    
    // Días del mes
    for (let dia = 1; dia <= diasEnMes; dia++) {
        const dayElement = document.createElement('div');
        dayElement.className = 'calendar-day';
        dayElement.textContent = dia;
        dayElement.dataset.day = dia;
        dayElement.id = `dia-${dia}`;
        
        // Marcar si es el día actual
        const esHoy = dia === hoy.getDate() && 
                     mes === (hoy.getMonth() + 1) && 
                     año === hoy.getFullYear();
        
        if (esHoy) {
            dayElement.classList.add('current-day');
        }
        
        // Marcar si es el día seleccionado
        const esSeleccionado = dia === diaSeleccionado && 
                              mes === mesSeleccionado && 
                              año === añoSeleccionado;
        
        if (esSeleccionado) {
            dayElement.classList.add('selected-day');
        }
        
        // Verificar eventos para este día
        const fechaStr = `${año}-${mes.toString().padStart(2, '0')}-${dia.toString().padStart(2, '0')}`;
        const eventosDia = eventos.filter(e => e.fecha === fechaStr);
        
        if (eventosDia.length > 0) {
            dayElement.classList.add('has-events');
            
            const badge = document.createElement('span');
            badge.className = 'event-badge';
            badge.textContent = eventosDia.length;
            dayElement.appendChild(badge);
            
            dayElement.title = eventosDia.map(e => e.titulo).join('\n');
        }
        
        dayElement.addEventListener('click', () => seleccionarDia(dia, mes, año));
        calendarGrid.appendChild(dayElement);
    }
    
    // Completar con días vacíos hasta 42 celdas (6 semanas)
    const totalCeldas = primerDiaSemana + diasEnMes;
    const celdasRestantes = 42 - totalCeldas;
    
    for (let i = 0; i < celdasRestantes; i++) {
        const emptyDay = document.createElement('div');
        emptyDay.className = 'calendar-day empty';
        calendarGrid.appendChild(emptyDay);
    }
}

function cambiarMes(delta) {
    let nuevoMes = mesActual + delta;
    let nuevoAño = añoActual;
    
    // Ajustar año si cambiamos de mes
    if (nuevoMes > 12) {
        nuevoMes = 1;
        nuevoAño += 1;
    } else if (nuevoMes < 1) {
        nuevoMes = 12;
        nuevoAño -= 1;
    }
    
    // Verificar límites: Oct 2025 - Ene 2026
    const fechaNueva = new Date(nuevoAño, nuevoMes - 1, 1);
    const fechaMin = new Date(2025, 9, 1);   // Oct 1, 2025
    const fechaMax = new Date(2026, 0, 31);  // Jan 31, 2026
    
    if (fechaNueva < fechaMin) {
        mostrarAlerta('No hay datos anteriores a Octubre 2025', 'warning');
        return;
    }
    
    if (fechaNueva > fechaMax) {
        mostrarAlerta('No hay datos posteriores a Enero 2026', 'warning');
        return;
    }
    
    mesActual = nuevoMes;
    añoActual = nuevoAño;
    
    generarCalendario(mesActual, añoActual);
    actualizarProximosEventos();
}

function seleccionarDia(dia, mes, año) {
    document.querySelectorAll('.calendar-day.selected-day').forEach(element => {
        element.classList.remove('selected-day');
    });
    
    const diaElement = document.getElementById(`dia-${dia}`);
    if (diaElement) {
        diaElement.classList.add('selected-day');
    }
    
    diaSeleccionado = dia;
    mesSeleccionado = mes || mesActual;
    añoSeleccionado = año || añoActual;
    
    mostrarEventosDelDia(dia, mesSeleccionado, añoSeleccionado);
}

function mostrarEventosDelDia(dia, mes, año) {
    const eventosContainer = document.getElementById('eventosContainer');
    const tituloEventos = document.getElementById('tituloEventosDia');
    
    const fechaCompleta = `${año}-${mes.toString().padStart(2, '0')}-${dia.toString().padStart(2, '0')}`;
    const fechaFormateada = formatFecha(fechaCompleta);
    
    const eventosDia = eventos.filter(evento => evento.fecha === fechaCompleta);
    
    tituloEventos.innerHTML = `<i class="fas fa-calendar-day me-2"></i>Eventos para el ${fechaFormateada}`;
    
    if (eventosDia.length === 0) {
        eventosContainer.innerHTML = `
            <div class="text-center text-muted py-5">
                <i class="fas fa-calendar-times fa-3x mb-3"></i>
                <h5>No hay eventos para este día</h5>
                <p class="mb-3">¡Es un buen día para descansar o adelantar trabajo!</p>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#nuevoEventoModal">
                    <i class="fas fa-plus me-1"></i>Agregar Evento
                </button>
            </div>
        `;
    } else {
        eventosContainer.innerHTML = eventosDia.map(evento => `
            <div class="agenda-event mb-3 p-3 border rounded evento-${evento.tipo}">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="flex-grow-1">
                        <div class="d-flex align-items-center mb-2">
                            <i class="${iconosEvento[evento.tipo] || 'fas fa-calendar'} me-2 text-${coloresEvento[evento.tipo] || 'primary'}"></i>
                            <h6 class="mb-0 text-${coloresEvento[evento.tipo] || 'primary'}">${evento.titulo}</h6>
                        </div>
                        
                        <div class="evento-info mb-2">
                            ${evento.hora ? `
                            <span class="badge bg-light text-dark me-2">
                                <i class="fas fa-clock me-1"></i>${evento.hora}
                            </span>
                            ` : ''}
                            
                            <span class="badge bg-${evento.prioridad === 'alta' ? 'danger' : evento.prioridad === 'media' ? 'warning' : 'success'} me-2">
                                ${evento.prioridad === 'alta' ? 'Alta' : evento.prioridad === 'media' ? 'Media' : 'Baja'} Prioridad
                            </span>
                            
                            <span class="badge bg-secondary">
                                ${evento.tipo.charAt(0).toUpperCase() + evento.tipo.slice(1)}
                            </span>
                        </div>
                        
                        ${evento.descripcion ? `
                        <p class="mb-2 small text-muted">
                            <i class="fas fa-align-left me-1"></i>
                            ${evento.descripcion}
                        </p>
                        ` : ''}
                        
                        <small class="text-muted">
                            <i class="fas fa-calendar me-1"></i>${formatFecha(evento.fecha)}
                        </small>
                    </div>
                    <div class="btn-group-vertical ms-2">
                        <button class="btn btn-outline-primary btn-sm" onclick="editarEvento('${evento.id}')">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-outline-danger btn-sm" onclick="eliminarEvento('${evento.id}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }
}

function eliminarEvento(eventoId) {
    if (confirm('¿Estás seguro de que quieres eliminar este evento?')) {
        eventos = eventos.filter(evento => evento.id !== eventoId);
        localStorage.setItem('eventosAgenda', JSON.stringify(eventos));
        
        mostrarEventosDelDia(diaSeleccionado, mesSeleccionado, añoSeleccionado);
        generarCalendario(mesActual, añoActual);
        actualizarProximosEventos();
        
        mostrarAlerta('Evento eliminado correctamente', 'success');
    }
}

function formatFecha(fechaStr) {
    const fecha = new Date(fechaStr + 'T00:00:00');
    const opciones = { 
        weekday: 'long',
        day: 'numeric', 
        month: 'long', 
        year: 'numeric' 
    };
    return fecha.toLocaleDateString('es-ES', opciones);
}

function guardarEvento() {
    const titulo = document.getElementById('tituloEvento').value.trim();
    const fecha = document.getElementById('fechaEvento').value;
    const hora = document.getElementById('horaEvento').value;
    const descripcion = document.getElementById('descripcionEvento').value.trim();
    const tipo = document.getElementById('tipoEvento').value;
    const prioridad = document.getElementById('prioridadEvento').value;
    
    if (!titulo || !fecha) {
        mostrarAlerta('Por favor completa al menos el título y la fecha', 'warning');
        return;
    }
    
    // Validar que la fecha esté en el rango permitido
    const fechaEvento = new Date(fecha + 'T00:00:00');
    const fechaMin = new Date('2025-10-01');
    const fechaMax = new Date('2026-01-31');
    
    if (fechaEvento < fechaMin) {
        mostrarAlerta('La fecha no puede ser anterior al 1 de Octubre de 2025', 'warning');
        return;
    }
    
    if (fechaEvento > fechaMax) {
        mostrarAlerta('La fecha no puede ser posterior al 31 de Enero de 2026', 'warning');
        return;
    }
    
    const nuevoEvento = {
        id: Date.now().toString(),
        titulo: titulo,
        fecha: fecha,
        hora: hora || '',
        descripcion: descripcion || '',
        tipo: tipo,
        prioridad: prioridad,
        fechaCreacion: new Date().toISOString()
    };
    
    eventos.push(nuevoEvento);
    localStorage.setItem('eventosAgenda', JSON.stringify(eventos));
    
    const modal = bootstrap.Modal.getInstance(document.getElementById('nuevoEventoModal'));
    modal.hide();
    
    const fechaEventoObj = new Date(fecha);
    if (fechaEventoObj.getMonth() + 1 === mesActual && fechaEventoObj.getFullYear() === añoActual) {
        mostrarEventosDelDia(fechaEventoObj.getDate(), mesActual, añoActual);
    }
    
    generarCalendario(mesActual, añoActual);
    
    actualizarProximosEventos();
    
    mostrarAlerta('Evento guardado correctamente!', 'success');
}

function agregarEventoRapido() {
    const fecha = document.getElementById('fechaRapida').value;
    const hora = document.getElementById('horaRapida').value;
    const descripcion = document.getElementById('descripcionRapida').value.trim();
    const tipo = document.getElementById('tipoRapido').value;
    
    if (!fecha || !descripcion) {
        mostrarAlerta('Por favor completa la fecha y descripción', 'warning');
        return;
    }
    
    // Validar que la fecha esté en el rango permitido
    const fechaEvento = new Date(fecha + 'T00:00:00');
    const fechaMin = new Date('2025-10-01');
    const fechaMax = new Date('2026-01-31');
    
    if (fechaEvento < fechaMin) {
        mostrarAlerta('La fecha no puede ser anterior al 1 de Octubre de 2025', 'warning');
        return;
    }
    
    if (fechaEvento > fechaMax) {
        mostrarAlerta('La fecha no puede ser posterior al 31 de Enero de 2026', 'warning');
        return;
    }
    
    const nuevoEvento = {
        id: Date.now().toString(),
        titulo: descripcion,
        fecha: fecha,
        hora: hora || '',
        descripcion: descripcion,
        tipo: tipo,
        prioridad: 'media',
        fechaCreacion: new Date().toISOString()
    };
    
    eventos.push(nuevoEvento);
    localStorage.setItem('eventosAgenda', JSON.stringify(eventos));
    
    document.getElementById('formEventoRapido').reset();
    const hoyStr = new Date().toISOString().split('T')[0];
    document.getElementById('fechaRapida').value = hoyStr;
    
    const fechaEventoObj = new Date(fecha);
    if (fechaEventoObj.getMonth() + 1 === mesActual && fechaEventoObj.getFullYear() === añoActual) {
        mostrarEventosDelDia(fechaEventoObj.getDate(), mesActual, añoActual);
    }
    
    generarCalendario(mesActual, añoActual);
    
    actualizarProximosEventos();
    
    mostrarAlerta('Evento agregado rápidamente!', 'success');
}

function editarEvento(eventoId) {
    const evento = eventos.find(e => e.id === eventoId);
    if (!evento) return;
    
    document.getElementById('tituloEvento').value = evento.titulo;
    document.getElementById('fechaEvento').value = evento.fecha;
    document.getElementById('horaEvento').value = evento.hora || '';
    document.getElementById('descripcionEvento').value = evento.descripcion || '';
    document.getElementById('tipoEvento').value = evento.tipo;
    document.getElementById('prioridadEvento').value = evento.prioridad || 'media';
    
    document.getElementById('guardarEventoBtn').innerHTML = '<i class="fas fa-save me-1"></i>Actualizar Evento';
    
    document.getElementById('guardarEventoBtn').dataset.editingId = eventoId;
    
    const modal = new bootstrap.Modal(document.getElementById('nuevoEventoModal'));
    modal.show();
    
    document.getElementById('guardarEventoBtn').onclick = function() {
        actualizarEvento(eventoId);
    };
}

function actualizarEvento(eventoId) {
    const titulo = document.getElementById('tituloEvento').value.trim();
    const fecha = document.getElementById('fechaEvento').value;
    const hora = document.getElementById('horaEvento').value;
    const descripcion = document.getElementById('descripcionEvento').value.trim();
    const tipo = document.getElementById('tipoEvento').value;
    const prioridad = document.getElementById('prioridadEvento').value;
    
    if (!titulo || !fecha) {
        mostrarAlerta('Por favor completa al menos el título y la fecha', 'warning');
        return;
    }
    
    // Validar que la fecha esté en el rango permitido
    const fechaEvento = new Date(fecha + 'T00:00:00');
    const fechaMin = new Date('2025-10-01');
    const fechaMax = new Date('2026-01-31');
    
    if (fechaEvento < fechaMin) {
        mostrarAlerta('La fecha no puede ser anterior al 1 de Octubre de 2025', 'warning');
        return;
    }
    
    if (fechaEvento > fechaMax) {
        mostrarAlerta('La fecha no puede ser posterior al 31 de Enero de 2026', 'warning');
        return;
    }
    
    const index = eventos.findIndex(e => e.id === eventoId);
    if (index !== -1) {
        eventos[index] = {
            ...eventos[index],
            titulo: titulo,
            fecha: fecha,
            hora: hora || '',
            descripcion: descripcion || '',
            tipo: tipo,
            prioridad: prioridad,
            fechaActualizacion: new Date().toISOString()
        };
        
        localStorage.setItem('eventosAgenda', JSON.stringify(eventos));
        
        const modal = bootstrap.Modal.getInstance(document.getElementById('nuevoEventoModal'));
        modal.hide();
        
        document.getElementById('guardarEventoBtn').innerHTML = '<i class="fas fa-save me-1"></i>Guardar Evento';
        document.getElementById('guardarEventoBtn').onclick = guardarEvento;
        delete document.getElementById('guardarEventoBtn').dataset.editingId;
        
        document.getElementById('formNuevoEvento').reset();
        const hoyStr = new Date().toISOString().split('T')[0];
        document.getElementById('fechaEvento').value = hoyStr;
        
        mostrarEventosDelDia(diaSeleccionado, mesSeleccionado, añoSeleccionado);
        generarCalendario(mesActual, añoActual);
        actualizarProximosEventos();
        
        mostrarAlerta('Evento actualizado correctamente!', 'success');
    }
}

function actualizarProximosEventos() {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    
    const proximos = eventos
        .filter(evento => {
            const fechaEvento = new Date(evento.fecha + 'T00:00:00');
            return fechaEvento >= hoy;
        })
        .sort((a, b) => new Date(a.fecha) - new Date(b.fecha))
        .slice(0, 10);
    
    const container = document.getElementById('proximosEventos');
    
    if (proximos.length === 0) {
        container.innerHTML = `
            <div class="text-center text-muted py-3">
                <i class="fas fa-calendar-check fa-lg mb-2"></i>
                <p>No hay próximos eventos</p>
                <button class="btn btn-outline-primary btn-sm mt-2" data-bs-toggle="modal" data-bs-target="#nuevoEventoModal">
                    <i class="fas fa-plus me-1"></i>Agregar Primer Evento
                </button>
            </div>
        `;
    } else {
        container.innerHTML = proximos.map(evento => {
            const fechaEvento = new Date(evento.fecha + 'T00:00:00');
            const fechaFormateada = fechaEvento.toLocaleDateString('es-ES', { 
                day: 'numeric', 
                month: 'short',
                year: 'numeric'
            }).toUpperCase();
            
            const diasRestantes = Math.ceil((fechaEvento - hoy) / (1000 * 60 * 60 * 24));
            let diasTexto = '';
            
            if (diasRestantes === 0) {
                diasTexto = '<span class="badge bg-danger">Hoy</span>';
            } else if (diasRestantes === 1) {
                diasTexto = '<span class="badge bg-warning">Mañana</span>';
            } else if (diasRestantes <= 7) {
                diasTexto = `<span class="badge bg-info">En ${diasRestantes} días</span>`;
            } else {
                diasTexto = `<span class="badge bg-secondary">En ${diasRestantes} días</span>`;
            }
            
            return `
                <div class="list-group-item list-group-item-action" onclick="seleccionarEvento('${evento.fecha}')">
                    <div class="d-flex w-100 justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <div class="d-flex align-items-center mb-1">
                                <i class="${iconosEvento[evento.tipo] || 'fas fa-calendar'} me-2 text-${coloresEvento[evento.tipo] || 'primary'}"></i>
                                <h6 class="mb-0">${evento.titulo}</h6>
                            </div>
                            <p class="mb-1 small text-muted">${evento.descripcion || ''}</p>
                            <div class="d-flex align-items-center">
                                <small class="text-muted me-2">
                                    <i class="fas fa-clock me-1"></i>${evento.hora || 'Todo el día'}
                                </small>
                                ${diasTexto}
                            </div>
                        </div>
                        <div class="text-end ms-2">
                            <small class="text-muted d-block">${fechaFormateada}</small>
                            <span class="badge bg-${evento.prioridad === 'alta' ? 'danger' : evento.prioridad === 'media' ? 'warning' : 'success'} mt-1">
                                ${evento.prioridad === 'alta' ? 'Alta' : evento.prioridad === 'media' ? 'Media' : 'Baja'}
                            </span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }
}

function seleccionarEvento(fecha) {
    const fechaObj = new Date(fecha + 'T00:00:00');
    const mes = fechaObj.getMonth() + 1;
    const año = fechaObj.getFullYear();
    const dia = fechaObj.getDate();
    
    if (mes !== mesActual || año !== añoActual) {
        mesActual = mes;
        añoActual = año;
        generarCalendario(mesActual, añoActual);
    }
    
    seleccionarDia(dia, mes, año);
    
    document.getElementById('eventosContainer').scrollIntoView({ behavior: 'smooth' });
}

function mostrarAlerta(mensaje, tipo = 'info') {
    const alerta = document.createElement('div');
    alerta.className = `alert alert-${tipo} alert-dismissible fade show position-fixed`;
    alerta.style.cssText = `
        top: 20px;
        right: 20px;
        z-index: 1050;
        max-width: 400px;
    `;
    alerta.innerHTML = `
        ${mensaje}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;
    
    document.body.appendChild(alerta);
    
    setTimeout(() => {
        if (alerta.parentNode) {
            alerta.remove();
        }
    }, 5000);
}

function exportarEventos() {
    const datos = {
        eventos: eventos,
        exportado: new Date().toISOString(),
        total: eventos.length
    };
    
    const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `eventos_agenda_${new Date().toISOString().split('T')[0]}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    mostrarAlerta('Eventos exportados correctamente', 'success');
}

function importarEventos() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const datos = JSON.parse(e.target.result);
                    if (datos.eventos && Array.isArray(datos.eventos)) {
                        eventos = datos.eventos;
                        localStorage.setItem('eventosAgenda', JSON.stringify(eventos));
                        
                        mostrarEventosDelDia(diaSeleccionado, mesSeleccionado, añoSeleccionado);
                        generarCalendario(mesActual, añoActual);
                        actualizarProximosEventos();
                        
                        mostrarAlerta(`${datos.eventos.length} eventos importados correctamente`, 'success');
                    } else {
                        mostrarAlerta('Formato de archivo inválido', 'danger');
                    }
                } catch (error) {
                    mostrarAlerta('Error al leer el archivo', 'danger');
                }
            };
            reader.readAsText(file);
        }
    };
    input.click();
}

document.addEventListener('DOMContentLoaded', function() {
    const cardHeader = document.querySelector('.card-header');
    const div = document.createElement('div');
    div.className = 'btn-group ms-2';
    div.innerHTML = `
        <button class="btn btn-outline-success btn-sm" onclick="exportarEventos()" title="Exportar eventos">
            <i class="fas fa-download"></i>
        </button>
        <button class="btn btn-outline-info btn-sm" onclick="importarEventos()" title="Importar eventos">
            <i class="fas fa-upload"></i>
        </button>
    `;
    cardHeader.querySelector('div').appendChild(div);
});
</script>

.calendar-day.empty:hover {

.event-badge {

}

.calendar-navigation button:disabled {

}

.calendar-navigation button:disabled:hover {

.agenda-event {

.agenda-event:hover {

.evento-info {

@media (max-width: 768px) {

        min-height: 40px;

@keyframes fadeIn {

.eventos-container {

.eventos-container::-webkit-scrollbar {
