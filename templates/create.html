{% extends "base.html" %}

{% block contenido %}
<div class="contenido-principal">
    <h2 class="mb-4">
        {% if item %}
            Editar {{ tipo|title }}
        {% else %}
            Crear Nuevo {{ tipo|title }}
        {% endif %}
    </h2>

    <form method="POST">
        <div class="mb-3">
            <label for="titulo" class="form-label">Título</label>
            <input type="text" class="form-control" id="titulo" name="titulo" 
                   value="{{ item.titulo if item else '' }}" required>
        </div>

        <div class="mb-3">
            <label for="contenido" class="form-label">Contenido</label>
            <textarea class="form-control" id="contenido" name="contenido" 
                      rows="5" required>{{ item.contenido if item else '' }}</textarea>
        </div>

        <div class="mb-3">
            <label for="autor" class="form-label">Autor</label>
            <input type="text" class="form-control" id="autor" name="autor" 
                   value="{{ item.autor if item else '' }}">
        </div>

        <div class="d-flex justify-content-between">
            <a href="{{ url_for('anuncios') }}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">
                {% if item %}
                    Actualizar
                {% else %}
                    Crear
                {% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
